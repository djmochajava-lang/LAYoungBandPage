# .github/workflows/static.yml
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ────────────────────────────────────────────────────────────────────
      # G-6 / CEO Directive 02, item 2.1 — PUBLICATION IS OPT-IN.
      #
      # This workflow used to upload `path: '.'`, i.e. the entire repository,
      # so every committed file became a live URL on layoungbandpage.com.
      # Verified live on 2026-08-02, all HTTP 200:
      #   /.claude/settings.local.json  /CLAUDE.md  /MERCH-PLAN.md  /README.md
      #   /dump-project-code.ps1  /add-path-comments.ps1
      #   /rename-gallery-images.ps1  /tools/seed-gallery-firestore.js
      #   /slideshow-config.txt  /images/merch/merch-set-index.md
      #
      # Nothing reaches the production domain unless it is named below.
      # Adding a file to the repo does NOT publish it. Adding a NEW top-level
      # site asset means adding it to PUBLISH_FILES / PUBLISH_DIRS here.
      # ────────────────────────────────────────────────────────────────────
      - name: Build publish directory (explicit allowlist)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Top-level files the live site serves.
          PUBLISH_FILES=(
            CNAME                            # Pages custom domain — required
            index.html                       # SPA shell
            contact.html                     # standalone contact page
            game.html                        # canvas mini-game entry
            player.html                      # standalone PWA player
            share.html
            mobile-menu.html                 # mobile nav overlay fragment
            google157279f32ae8e811.html      # Google Search Console verification
            manifest.json
            player-manifest.json
            player-sw.js                     # player PWA service worker
            robots.txt
            sitemap.xml
          )

          # Directories the live site loads from. Every one of these is
          # referenced by index.html / the page fragments / css / js.
          PUBLISH_DIRS=(
            EPK              # electronic press kit (public)
            GroovyBandRush   # Phaser mini-game + its assets
            Media            # featured-track audio
            Video            # site videos
            css
            fonts
            images           # artist, band, gallery (124), backgrounds, icons, merch
            js
            music            # background music tracks
            pages            # dynamically loaded page fragments
            sounds           # UI sound effects
          )

          for f in "${PUBLISH_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::allowlisted file is missing from the checkout: $f"
              exit 1
            fi
            cp -p "$f" _site/
          done

          for d in "${PUBLISH_DIRS[@]}"; do
            if [ ! -d "$d" ]; then
              echo "::error::allowlisted directory is missing from the checkout: $d"
              exit 1
            fi
            cp -a "$d" _site/
          done

          # Scrub file types that must never be public even when they live
          # inside an allowlisted directory. This is not hypothetical:
          # images/merch/merch-set-index.md and
          # images/merch/pipeline/README-merch-delivery.md were both live
          # (HTTP 200) before this change, and neither is referenced by the site.
          find _site \( \
                 -name '*.md'  -o -name '*.markdown' -o \
                 -name '*.ps1' -o -name '*.sh'       -o \
                 -name '.env*' -o -name '*.pem'      -o -name '*.key' -o \
                 -name '._*'   -o -name '.DS_Store'  -o -name 'Thumbs.db' \
               \) -type f -print -delete

      - name: Verify no internal file reached the artifact
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r p; do
            case "$p" in
              *.md|*.ps1|*.sh|*/.env*|*.pem|*.key|*/._*|*/.DS_Store)
                echo "::error::forbidden file in publish artifact: $p"; fail=1 ;;
              _site/.claude/*|_site/.github/*|_site/tools/*)
                echo "::error::forbidden path in publish artifact: $p"; fail=1 ;;
            esac
          done < <(find _site -type f)
          if [ "$fail" -ne 0 ]; then
            echo "::error::publish artifact rejected — fix the allowlist above"
            exit 1
          fi
          echo "publish artifact OK — $(find _site -type f | wc -l) files"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Allowlisted publish directory ONLY — never the repository root.
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages CDN propagation stalled >10min on 2026-07-02 (runs 28601835742,
          # 28603669859 both aborted at the action's default 600000ms poll timeout
          # while the deployment was still in_progress). Allow up to 30 minutes.
          timeout: 1800000
