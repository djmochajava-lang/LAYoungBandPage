<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L.A. Young — Music Player</title>
  <link rel="icon" type="image/png" href="images/la-avatar.png" />
  <link rel="manifest" href="player-manifest.json" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <!-- Google Fonts (same as main site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Georgia&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Music Player styles (extracted from page HTML) -->
  <link rel="stylesheet" href="css/music-player.css" />

  <style>
    /* Minimal reset for standalone player window */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-primary: #ffd700;
      --color-accent: #e63946;
      --color-bg-dark: #0a0a0a;
      --color-bg-navy: #1a1a2e;
      --color-bg-blue: #16213e;
      --color-text: #ffffff;
      --color-text-muted: rgba(255, 255, 255, 0.6);
      --font-primary: 'Playfair Display', 'Didot', serif;
      --font-secondary: 'Georgia', 'Times New Roman', serif;
      --spacing-xs: 0.5rem;
      --spacing-sm: 1rem;
      --spacing-md: 2rem;
      --spacing-lg: 4rem;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --border-gold: 1px solid rgba(255, 215, 0, 0.2);
      --transition-base: 0.3s ease;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: var(--color-text);
      font-family: var(--font-secondary);
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 12px;
    }

    /* === Phone Frame — centered with visible bezel === */
    .phone-frame {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 780px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #1a1a1a;
      border-radius: 40px;
      border: 4px solid #2a2a2a;
      box-shadow:
        0 0 0 1px #111,
        0 8px 30px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .phone-notch {
      flex-shrink: 0;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      position: relative;
    }
    .phone-notch::after {
      content: '';
      width: 90px;
      height: 22px;
      background: #0a0a0a;
      border-radius: 0 0 14px 14px;
      position: absolute;
      top: 0;
    }

    .phone-screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--color-bg-dark);
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .phone-screen::-webkit-scrollbar { width: 3px; }
    .phone-screen::-webkit-scrollbar-track { background: transparent; }
    .phone-screen::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 2px; }

    .phone-home-indicator {
      flex-shrink: 0;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
    }
    .phone-home-indicator::after {
      content: '';
      width: 100px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    /* Resize gold knob indicator for smaller phone knob (32px vs original 44px) */
    .phone-screen .sp-knob-indicator {
      height: 8px !important;
      top: 3px !important;
      transform-origin: 50% 13px !important;
    }

    /* Player overrides — force mobile layout inside phone screen */
    .phone-screen #LAYoungMusicPlayer {
      min-height: auto !important;
      padding: 0 !important;
    }
    .phone-screen #LAYoungMusicPlayer > .container {
      max-width: 100% !important;
      padding: 0 !important;
      width: 100% !important;
    }
    /* Override desktop media query styles — keep compact mobile layout */
    .phone-screen .sp-hero {
      height: 340px !important;
      border-radius: 0 !important;
    }
    .phone-screen .sp-hero-content {
      padding: 18px 12px 22px !important;
    }
    .phone-screen .sp-action-bar {
      padding: 10px 10px !important;
      gap: 8px !important;
      flex-wrap: nowrap !important;
    }
    .phone-screen .sp-body {
      padding: 0 10px 40px !important;
    }
    .phone-screen .sp-disco-scroll,
    .phone-screen .sp-collabs-scroll {
      margin: 0 -10px !important;
      padding-left: 10px !important;
      padding-right: 10px !important;
    }
    .phone-screen .sp-disco-card {
      width: 130px !important;
    }
    /* Shrink volume knob for phone */
    .phone-screen .sp-knob-outer {
      width: 32px !important;
      height: 32px !important;
    }
    .phone-screen .sp-vol-pct {
      font-size: 10px !important;
      min-width: 22px !important;
    }
    .phone-screen .sp-vol-label {
      font-size: 15px !important;
    }
    .phone-screen .sp-volume-wrap {
      gap: 6px !important;
    }
    .phone-screen .sp-play-btn {
      width: 40px !important;
      height: 40px !important;
    }
    .phone-screen .sp-follow-btn {
      padding: 6px 14px !important;
      font-size: 0.7rem !important;
    }
    .phone-screen .sp-more-btn {
      width: 32px !important;
      height: 32px !important;
      font-size: 16px !important;
    }
    /* Compact track list rows */
    .phone-screen .sp-track-item {
      padding: 8px 10px !important;
      gap: 10px !important;
      min-height: 48px !important;
    }
    .phone-screen .sp-track-name {
      font-size: 0.85rem !important;
    }
    .phone-screen .sp-track-art {
      width: 38px !important;
      height: 38px !important;
    }
    /* Compact section headings */
    .phone-screen .sp-section-title {
      font-size: 1rem !important;
    }

    /* Compact playback control icons for phone */
    .phone-screen .sp-ctrl-btn svg {
      width: 16px !important;
      height: 16px !important;
    }
    .phone-screen .sp-eq-bars {
      height: 14px !important;
      width: 18px !important;
    }
    /* Compact collab images for phone */
    .phone-screen .sp-collab-img,
    .phone-screen .sp-collab-img-placeholder {
      width: 80px !important;
      height: 80px !important;
    }
    .phone-screen .sp-collab-card {
      width: 100px !important;
    }
    .phone-screen .sp-collabs-scroll {
      gap: 14px !important;
    }

    /* Fix Follow modal to stay inside phone screen */
    .phone-screen .sp-follow-modal {
      max-width: 340px !important;
      padding: 24px 20px !important;
      max-height: 85vh !important;
      overflow-y: auto !important;
    }

    /* Section base (needed by the player page) */
    .section {
      position: relative;
      width: 100%;
    }

    /* Button styles used by Follow button */
    .btn { display: inline-block; padding: 0.75rem 1.5rem; border-radius: var(--radius-sm); text-decoration: none; font-weight: 600; cursor: pointer; transition: all var(--transition-base); border: none; }
    .btn-primary { background: var(--color-primary); color: #000; }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

    /* Container */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 var(--spacing-md); }

    /* Install App Banner */
    .install-banner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 16px;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.12), rgba(255, 215, 0, 0.05));
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      font-family: var(--font-secondary);
      font-size: 0.8rem;
      color: var(--color-text-muted);
    }
    .install-banner.visible { display: flex; }
    .install-banner-text { white-space: nowrap; }
    .install-banner-btn {
      padding: 4px 14px;
      background: var(--color-primary);
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: filter 0.2s;
      white-space: nowrap;
    }
    .install-banner-btn:hover { filter: brightness(1.15); }
    .install-banner-close {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .install-banner-close:hover { color: rgba(255, 255, 255, 0.8); }
  </style>
</head>
<body>

  <!-- App banner: Install (in browser) or Check for Updates (in standalone PWA) -->
  <div class="install-banner" id="install-banner">
    <span class="install-banner-text" id="banner-text">Remove browser chrome —</span>
    <button class="install-banner-btn" id="install-btn">Install as App</button>
    <button class="install-banner-close" id="install-dismiss" aria-label="Dismiss">&times;</button>
  </div>

  <!-- Phone Frame -->
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="phone-screen" id="player-content">
      <!-- Player content loads here -->
    </div>
    <div class="phone-home-indicator"></div>
  </div>

  <!-- Firebase SDK (needed for Follow button) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <!-- Site config (Firebase credentials) -->
  <script src="js/config.js"></script>

  <script>
    // Register service worker for PWA standalone mode (chrome-less window)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('player-sw.js').catch(function() {});
    }

    // Resize standalone PWA to phone dimensions on launch
    (function() {
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                      || window.navigator.standalone === true;
      if (isStandalone) {
        var targetW = 420;
        var targetH = 780;
        // Only resize if window is significantly larger than target
        if (window.outerWidth > targetW + 50 || window.outerHeight > targetH + 50) {
          window.resizeTo(targetW, targetH);
          // Position bottom-right of screen
          var left = screen.availWidth - targetW - 30;
          var top = screen.availHeight - targetH - 60;
          window.moveTo(left, top);
        }
      }
    })();

    // === PWA Install / Update System ===
    (function() {
      var deferredPrompt = null;
      var banner = document.getElementById('install-banner');
      var bannerText = document.getElementById('banner-text');
      var installBtn = document.getElementById('install-btn');
      var dismissBtn = document.getElementById('install-dismiss');
      var mode = 'install'; // 'install', 'update', or 'check'

      var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                      || window.navigator.standalone === true;

      // Always show the banner immediately
      banner.classList.add('visible');

      if (isStandalone) {
        // ── STANDALONE PWA → "Check for Updates" ──
        mode = 'check';
        bannerText.textContent = '';
        installBtn.textContent = 'Check for Updates';
      } else {
        // ── BROWSER POPUP → start as "Install as App", may switch to "Update App" ──
        mode = 'install';
        bannerText.textContent = 'Remove browser chrome —';
        installBtn.textContent = 'Install as App';

        // Listen for install prompt (only fires if app is NOT already installed)
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          deferredPrompt = e;
          // Keep showing "Install as App"
          mode = 'install';
          bannerText.textContent = 'Remove browser chrome —';
          installBtn.textContent = 'Install as App';
        });

        // If beforeinstallprompt doesn't fire within 1.5s, app is already installed
        setTimeout(function() {
          if (!deferredPrompt && mode === 'install') {
            mode = 'update';
            bannerText.textContent = '';
            installBtn.textContent = 'Update App';
          }
        }, 1500);
      }

      // ── Button click handler — adapts to current mode ──
      installBtn.addEventListener('click', function() {
        if (mode === 'install' && deferredPrompt) {
          // Trigger native install dialog
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function(result) {
            if (result.outcome === 'accepted') {
              console.log('🎵 Player installed as app');
              forceSwUpdate();
            }
            deferredPrompt = null;
          });

        } else if (mode === 'update') {
          // Force SW update from browser (app already installed)
          installBtn.textContent = 'Updating…';
          installBtn.disabled = true;
          forceSwUpdate();
          setTimeout(function() {
            installBtn.textContent = 'Updated! Reopen the app ✓';
            setTimeout(function() {
              installBtn.textContent = 'Update App';
              installBtn.disabled = false;
            }, 3000);
          }, 1500);

        } else if (mode === 'check') {
          // Check for updates inside standalone PWA
          installBtn.textContent = 'Checking…';
          installBtn.disabled = true;

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration().then(function(reg) {
              if (!reg) {
                showCheckResult('No service worker found', false);
                return;
              }
              reg.update().then(function() {
                if (reg.waiting) {
                  reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                  showCheckResult('Updated! Reloading…', true);
                  setTimeout(function() { location.reload(); }, 1000);
                } else if (reg.installing) {
                  reg.installing.addEventListener('statechange', function() {
                    if (this.state === 'installed') {
                      this.postMessage({ type: 'SKIP_WAITING' });
                      showCheckResult('Updated! Reloading…', true);
                      setTimeout(function() { location.reload(); }, 1000);
                    }
                  });
                } else {
                  showCheckResult('Already up to date ✓', false);
                }
              }).catch(function() {
                showCheckResult('Update check failed', false);
              });
            });
          } else {
            showCheckResult('Updates not supported', false);
          }
        }
      });

      function showCheckResult(msg, isUpdate) {
        installBtn.textContent = msg;
        if (!isUpdate) {
          setTimeout(function() {
            installBtn.textContent = 'Check for Updates';
            installBtn.disabled = false;
          }, 2500);
        }
      }

      // Hide banner if app gets installed (mid-session)
      window.addEventListener('appinstalled', function() {
        deferredPrompt = null;
        bannerText.textContent = '';
        installBtn.textContent = 'App Installed ✓';
        installBtn.disabled = true;
        forceSwUpdate();
        setTimeout(function() {
          mode = 'update';
          installBtn.textContent = 'Update App';
          installBtn.disabled = false;
        }, 2500);
        console.log('🎵 Player app installed');
      });

      // Dismiss button — hides for current session only
      dismissBtn.addEventListener('click', function() {
        banner.classList.remove('visible');
      });

      // Force service worker to fetch latest from server
      function forceSwUpdate() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistration().then(function(reg) {
          if (reg) {
            reg.update().then(function() {
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              console.log('🎵 Service worker updated');
            });
          }
        });
      }
    })();

    // BackgroundMusic stub — standalone player has no background music
    window.BackgroundMusic = {
      enabled: false,
      currentAudio: null,
      stop: function() {},
      handlePageChange: function() {}
    };

    // Load the music player page
    // Use .tpl extension for dev (Live Server injects scripts into .html, corrupting content)
    // On production (GitHub Pages), .tpl works fine as a static file
    fetch('pages/LAYoungMusicPlayer.tpl?v=' + Date.now())
      .then(function(r) { return r.text(); })
      .then(function(html) {
        var container = document.getElementById('player-content');

        // Strip ALL <script> tags (dev-server injects corrupt ones)
        var cleanHTML = html.replace(/<script[\s\S]*?<\/script>/gi, '');
        container.innerHTML = cleanHTML;

        // Load player JS as external script (immune to dev-server injection)
        var playerScript = document.createElement('script');
        playerScript.src = 'js/music-player-app.js';
        container.appendChild(playerScript);

        console.log('🎵 Standalone player loaded');
      })
      .catch(function(err) {
        console.error('Failed to load player:', err);
      });
  </script>
</body>
</html>
