<!-- pages/gallery-mobile.html — Social gallery: stories row + feed -->

<section class="section gallery-mobile-section" id="gallery">
  <div class="mg-page">

    <!-- ═══════════ STORIES ROW (Facebook-style horizontal squares) ═══════════ -->
    <div class="mg-stories">
      <div class="mg-stories-label">Reels</div>
      <div class="mg-stories-row" id="mg-stories-row">
        <!-- JS injects .mg-story-thumb squares from artistImages -->
      </div>
    </div>

    <!-- ═══════════ FEED (Full-size images with comments, vertical scroll) ═══════════ -->
    <div class="mg-feed-label">Feed</div>
    <div class="mg-feed" id="mg-feed">
      <!-- JS injects .mg-post items from eventImages -->
    </div>

    <!-- Load more sentinel -->
    <div class="mg-feed-sentinel" id="mg-feed-sentinel">
      <div class="mg-feed-loader"></div>
    </div>

    <!-- ═══════════ FEED VIEWER (tap a feed post to expand full-screen) ═══════════ -->
    <div class="mg-feed-viewer" id="mg-feed-viewer">
      <button class="mg-fv-close" id="mg-fv-close" aria-label="Close">&times;</button>
      <div class="mg-fv-counter" id="mg-fv-counter"></div>
      <div class="mg-fv-slide" id="mg-fv-slide">
        <img id="mg-fv-img" src="" alt="">
      </div>
      <div class="mg-fv-caption" id="mg-fv-caption"></div>
      <div class="mg-fv-actions" id="mg-fv-actions">
        <button class="mg-post-action mg-fv-like" id="mg-fv-like" aria-label="Like">
          <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </div>

    <!-- ═══════════ STORIES VIEWER (tap a story square to view full) ═══════════ -->
    <div class="mg-story-viewer" id="mg-story-viewer">
      <div id="mg-sv-topbar" style="position:absolute;top:0;left:0;right:0;height:6px;background:#ffd700;z-index:50"></div>
      <div class="mg-sv-branding">L.A. Young <span class="mg-sv-branding-page">Band Page</span> <span class="mg-sv-branding-divider">|</span> <span class="mg-sv-branding-reels">Reels</span></div>
      <div class="mg-sv-progress" id="mg-sv-progress"></div>
      <img id="mg-sv-img" src="" alt="">
      <div class="mg-sv-caption" id="mg-sv-caption"></div>
      <button class="mg-sv-close" id="mg-sv-close" aria-label="Close">&times;</button>
      <div class="mg-sv-nav mg-sv-prev" id="mg-sv-prev"></div>
      <div class="mg-sv-nav mg-sv-next" id="mg-sv-next"></div>
    </div>

    <!-- ═══════════ ADMIN EDIT FAB (hidden until authorized) ═══════════ -->
    <button class="mg-admin-fab" id="mg-admin-fab" aria-label="Edit gallery" style="display:none">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>

    <!-- ═══════════ ADD CARD PANEL (admin only) ═══════════ -->
    <div class="mg-admin-add-panel" id="mg-admin-add-panel" style="display:none">
      <div class="mg-admin-add-inner">
        <h3>Add Feed Post</h3>
        <input type="url" id="mg-admin-add-url" placeholder="Image URL" class="mg-admin-input">
        <input type="text" id="mg-admin-add-caption" placeholder="Caption" maxlength="200" class="mg-admin-input">
        <div class="mg-admin-add-actions">
          <button class="mg-admin-btn mg-admin-btn-cancel" id="mg-admin-add-cancel">Cancel</button>
          <button class="mg-admin-btn mg-admin-btn-save" id="mg-admin-add-save">Add Post</button>
        </div>
      </div>
    </div>

    <!-- PAGE FOOTER -->
    <footer class="page-footer">
      <div class="footer-content">
        <p class="footer-text">
          &copy; 2026 <strong>Gold Bottom Entertainment LLC</strong> | All rights
          reserved.
        </p>
      </div>
    </footer>
  </div>

  <!-- Init mobile gallery + on-screen debug (remove after testing) -->
  <script>
    if (typeof MobileGallery !== 'undefined') MobileGallery.init();
  </script>
</section>
