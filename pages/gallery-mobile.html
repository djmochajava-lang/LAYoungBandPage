<!-- pages/gallery-mobile.html — Social gallery: stories row + feed -->

<section class="section gallery-mobile-section" id="gallery">
  <div class="mg-page">

    <!-- ═══════════ STORIES ROW (Facebook-style horizontal squares) ═══════════ -->
    <div class="mg-stories">
      <div class="mg-stories-row" id="mg-stories-row">
        <!-- JS injects .mg-story-thumb squares from artistImages -->
      </div>
    </div>

    <!-- ═══════════ FEED (Full-size images with comments, vertical scroll) ═══════════ -->
    <div class="mg-feed" id="mg-feed">
      <!-- JS injects .mg-post items from eventImages -->
    </div>

    <!-- Load more sentinel -->
    <div class="mg-feed-sentinel" id="mg-feed-sentinel">
      <div class="mg-feed-loader"></div>
    </div>

    <!-- ═══════════ STORIES VIEWER (tap a story square to view full) ═══════════ -->
    <div class="mg-story-viewer" id="mg-story-viewer">
      <div class="mg-sv-progress" id="mg-sv-progress"></div>
      <img id="mg-sv-img" src="" alt="">
      <div class="mg-sv-caption" id="mg-sv-caption"></div>
      <button class="mg-sv-close" id="mg-sv-close" aria-label="Close">&times;</button>
      <div class="mg-sv-nav mg-sv-prev" id="mg-sv-prev"></div>
      <div class="mg-sv-nav mg-sv-next" id="mg-sv-next"></div>
    </div>

    <!-- PAGE FOOTER -->
    <footer class="page-footer">
      <div class="footer-content">
        <p class="footer-text">
          &copy; 2026 <strong>Gold Bottom Entertainment LLC</strong> | All rights
          reserved.
        </p>
      </div>
    </footer>
  </div>

  <!-- Init mobile gallery + on-screen debug (remove after testing) -->
  <div id="mg-debug" style="position:fixed;bottom:60px;left:8px;right:8px;background:rgba(0,0,0,0.9);color:#0f0;font-family:monospace;font-size:11px;padding:10px;border-radius:8px;z-index:99999;max-height:40vh;overflow-y:auto;border:1px solid #0f0"></div>
  <script>
    (function() {
      var d = document.getElementById('mg-debug');
      function log(msg) { d.innerHTML += msg + '<br>'; }

      log('BUILD: v4 — 56px pad, story viewer swipe fix');
      var banner = document.querySelector('.top-banner');
      log('banner height: ' + (banner ? banner.offsetHeight + 'px' : 'not found'));
      log('2. artistImages: ' + (typeof artistImages !== 'undefined' ? artistImages.length + ' items' : 'UNDEFINED'));
      log('3. eventImages: ' + (typeof eventImages !== 'undefined' ? eventImages.length + ' items' : 'UNDEFINED'));
      log('4. MobileGallery: ' + (typeof MobileGallery !== 'undefined' ? 'LOADED' : 'UNDEFINED'));
      log('5. stories-row element: ' + (document.getElementById('mg-stories-row') ? 'FOUND' : 'NOT FOUND'));
      log('6. feed element: ' + (document.getElementById('mg-feed') ? 'FOUND' : 'NOT FOUND'));
      log('7. screen width: ' + window.innerWidth + 'px');

      if (typeof MobileGallery !== 'undefined') {
        try {
          MobileGallery.init();
          log('8. MobileGallery.init() called OK');
          log('9. stories count: ' + document.querySelectorAll('.mg-story-thumb').length);
          log('10. feed posts: ' + document.querySelectorAll('.mg-post').length);
        } catch(e) {
          log('ERROR: ' + e.message);
        }
      } else {
        log('ERROR: MobileGallery not loaded - check js/mobile-gallery.js');
      }
    })();
  </script>
</section>
