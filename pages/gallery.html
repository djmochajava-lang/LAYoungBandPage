<!-- pages/gallery.html -->

<section class="section gallery-section" id="gallery">
  <div class="container">

    <!-- Futuristic Gallery Header -->
    <div class="fg-header">
      <h2 class="fg-title">My Gallery</h2>
      <p class="fg-subtitle">Moments in Color</p>
      <div class="fg-header-line"><span></span></div>
    </div>

    <!-- Floating Particles (created by JS) -->
    <div class="fg-particles" id="fg-particles"></div>
    <!-- Scan Line -->
    <div class="fg-scan-line"></div>

    <!-- 3D Showcase -->
    <div class="fg-showcase" id="fg-showcase">
      <div class="fg-showcase-frame" id="fg-showcaseFrame">
        <!-- Images injected by JS -->
        <div class="fg-showcase-caption">
          <div class="fg-caption-left">
            <div class="fg-cap-title" id="fg-capTitle"></div>
            <div class="fg-cap-sub" id="fg-capSub"></div>
          </div>
          <div class="fg-caption-right" id="fg-capCount"></div>
        </div>
        <button class="fg-nav-btn fg-prev" id="fg-prevBtn" aria-label="Previous">&#8249;</button>
        <button class="fg-nav-btn fg-next" id="fg-nextBtn" aria-label="Next">&#8250;</button>
      </div>
      <!-- Progress ring (built by JS to avoid innerHTML SVG issues) -->
      <div class="fg-progress-ring-wrap" id="fg-progressRingWrap"></div>
    </div>

    <!-- Thumbnail Strip -->
    <div class="fg-thumb-strip" id="fg-thumbStrip">
      <!-- Thumbnails injected by JS -->
    </div>

    <!-- Futuristic Lightbox -->
    <div class="fg-lightbox" id="fg-lightbox">
      <button class="fg-lb-close" id="fg-lbClose" aria-label="Close">&times;</button>
      <button class="fg-lb-nav fg-lb-prev" id="fg-lbPrev" aria-label="Previous">&#8249;</button>
      <button class="fg-lb-nav fg-lb-next" id="fg-lbNext" aria-label="Next">&#8250;</button>
      <div class="fg-lb-img-wrap">
        <img id="fg-lbImg" src="" alt="">
      </div>
      <div class="fg-lb-caption">
        <div class="fg-lb-title" id="fg-lbTitle"></div>
        <div class="fg-lb-count" id="fg-lbCount"></div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- EVENT SLIDESHOW SECTION -->
    <div class="slideshow-section scroll-reveal">
      <h2 class="section-title">Event Slideshow</h2>
      <p class="section-subtitle">Backstage Sneak Peeks & More</p>

      <!-- Slideshow Container -->
      <div class="slideshow-container">
        <!-- Slideshow will be dynamically populated by JavaScript -->
        <div class="slideshow-wrapper">
          <div class="slideshow-image-container">
            <img
              id="slideshow-image"
              src=""
              alt="Event Photo"
              class="slideshow-image"
            />
          </div>

          <!-- Navigation Arrows -->
          <button class="slideshow-prev" aria-label="Previous slide">
            <span>&#8249;</span>
          </button>
          <button class="slideshow-next" aria-label="Next slide">
            <span>&#8250;</span>
          </button>

          <!-- Slide Counter -->
          <div class="slideshow-counter">
            <span id="current-slide">1</span> / <span id="total-slides">0</span>
          </div>

          <!-- Caption -->
          <div class="slideshow-caption" id="slideshow-caption">
            Backstage moments
          </div>
        </div>

        <!-- Play/Pause Controls -->
        <div class="slideshow-controls">
          <button class="slideshow-control-btn" id="slideshow-play-pause">
            <span class="play-icon">▶</span>
            <span class="pause-icon" style="display: none">⏸</span>
          </button>
          <span class="slideshow-status">Auto-playing</span>
        </div>

        <!-- Thumbnail Navigation (Optional) -->
        <div class="slideshow-thumbnails" id="slideshow-thumbnails">
          <!-- Thumbnails will be dynamically added here -->
        </div>
      </div>
    </div>

    <!-- PAGE FOOTER (shows on mobile only) -->
    <footer class="page-footer">
      <div class="footer-content">
        <p class="footer-text">
          © 2026 <strong>Gold Bottom Entertainment LLC</strong> | All rights
          reserved.
        </p>
      </div>
    </footer>
  </div>
</section>
