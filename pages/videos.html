<!-- pages/videos.html -->

<section class="section videos-section" id="videos">
  <div class="container">
    <h2 class="section-title">Videos</h2>
    <p class="section-subtitle">Experience the Live Performance</p>

    <div class="videos-content">
      <!-- Video Grid (single column) -->
      <div class="video-grid">
        <!-- Video 1 -->
        <div class="video-item scroll-reveal">
          <h3>Sneak Peek</h3>
          <p class="video-subtitle">Behind the Scenes</p>
          <div style="border-radius: 12px; box-shadow: inset 0 4px 12px rgba(0,0,0,0.7), inset 0 1px 3px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.4); padding: 4px; background: linear-gradient(145deg, #0d0d0d, #1a1a1a); overflow: hidden;">
            <video preload="metadata" playsinline controls
                   src="Video/BehindTheScenes.mp4"
                   style="width: 100%; display: block; border-radius: 8px;">
            </video>
          </div>
        </div>

        <!-- Video 2 -->
        <div class="video-item scroll-reveal delay-1">
          <h3>L.A. Young Live</h3>
          <p class="video-subtitle">City Winery Performance</p>
          <div style="border-radius: 12px; box-shadow: inset 0 4px 12px rgba(0,0,0,0.7), inset 0 1px 3px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.4); padding: 4px; background: linear-gradient(145deg, #0d0d0d, #1a1a1a); overflow: hidden;">
            <video preload="metadata" playsinline controls
                   src="Video/LAYoungWinery.mp4"
                   style="width: 100%; max-height: 776px; object-fit: cover; object-position: center 70%; display: block; border-radius: 8px;">
            </video>
          </div>
        </div>
      </div>

      <!-- YouTube Subscribe (hidden for now)
      <div class="youtube-subscribe scroll-reveal delay-2">
        <h3>Stay Updated</h3>
        <p>Subscribe to the YouTube channel for new videos and performances</p>
        <a href="#" class="btn btn-primary btn-large" target="_blank">
          Subscribe on YouTube
        </a>
      </div>
      -->
    </div>

    <!-- PAGE FOOTER (shows on mobile only) -->
    <footer class="page-footer">
      <div class="footer-content">
        <p class="footer-text">
          © 2026 <strong>Powered By Gold Bottom Ent. LLC</strong> | All rights
          reserved.
        </p>
      </div>
    </footer>
  </div>
</section>
