<!-- pages/contact.html -->

<section class="section contact-section" id="contact">
  <div class="container">
    <h2 class="section-title">Connect</h2>
    <p class="section-subtitle">Let's Make Music Together</p>

    <div class="social-links scroll-reveal" style="max-width:700px;margin:0 auto;text-align:center">
      <h3>Subscribe to join the Community</h3>
      <p>Be part of the L.A. Young experience</p>

      <div style="margin-top:16px;display:flex;justify-content:center">
        <img src="../images/community-connect.jpeg" alt="Subscribe to join the Community" style="width:100%;max-width:400px;border-radius:12px" />
      </div>

      <p style="margin-top:16px">Get exclusive updates, tour announcements, and new music first</p>

      <form id="signup-form" class="signup-form">
        <input
          type="email"
          class="form-input"
          placeholder="Your email address"
          required
          aria-label="Email address"
        />
        <button type="submit" class="btn btn-primary submit-btn">
          Subscribe
        </button>
      </form>
    </div>

    <div class="divider"></div>

    <!-- Fan Wall CTA -->
    <div class="scroll-reveal delay-2" style="text-align:center;margin-bottom:var(--space-lg,32px)">
      <a href="#fanwall" class="btn btn-secondary btn-large" style="display:inline-flex;align-items:center;gap:8px">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/><path d="M7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/></svg>
        Fan Wall
      </a>
    </div>

    <div class="divider"></div>

    <!-- Contact Form -->
    <div class="contact-form-section scroll-reveal delay-3">
      <h3>Send a Message</h3>
      <p>Have a question? Drop us a line</p>

      <form id="contact-form" class="contact-form">
        <div class="form-group">
          <label for="contact-name" class="form-label">Name</label>
          <input
            type="text"
            id="contact-name"
            name="name"
            class="form-input"
            required
          />
        </div>

        <div class="form-group">
          <label for="contact-email" class="form-label">Email</label>
          <input
            type="email"
            id="contact-email"
            name="email"
            class="form-input"
            required
          />
        </div>

        <div class="form-group">
          <label for="contact-subject" class="form-label">Subject</label>
          <input
            type="text"
            id="contact-subject"
            name="subject"
            class="form-input"
            required
          />
        </div>

        <div class="form-group">
          <label for="contact-message" class="form-label">Message</label>
          <textarea
            id="contact-message"
            name="message"
            class="form-textarea"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-large">
          Send Message
        </button>
      </form>
    </div>

    <!-- PAGE FOOTER (shows on mobile only) -->
    <footer class="page-footer">
      <div class="footer-content">
        <p class="footer-text">
          &copy; 2026 <strong>Powered By Gold Bottom Ent. LLC</strong> | All rights
          reserved.
        </p>
      </div>
    </footer>
  </div>
</section>
