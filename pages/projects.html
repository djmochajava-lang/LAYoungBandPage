<!-- pages/projects.html -->

<section class="section projects-section" id="projects">
  <div class="container">
    <h2 class="section-title">Projects</h2>
    <p class="section-subtitle">What's cooking in the studio</p>
    <div class="music-content">

      <!-- Studio Production Team Photo -->
      <div class="studio-photo scroll-reveal">
        <img
          src="images/artist/GBENT.jpg"
          alt="Studio Production Team"
          class="studio-team-image"
          loading="lazy"
        />
      </div>

      <div class="divider"></div>

      <!-- Upcoming Track -->
      <div class="featured-track scroll-reveal delay-1">
        <h3>"Sentimental Mood"</h3>
        <p class="track-description">
          A Duke Ellington Classic with a Modern Twist
        </p>

        <div style="border-radius: 12px; box-shadow: inset 0 4px 12px rgba(0,0,0,0.7), inset 0 1px 3px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.4); padding: 4px; background: linear-gradient(145deg, #0d0d0d, #1a1a1a); overflow: hidden;">
          <video preload="metadata" playsinline controls
                 src="Video/SentimentalMood.mp4"
                 style="width: 100%; display: block; border-radius: 8px;">
          </video>
        </div>
      </div>

      <!-- Upcoming Track 2 -->
      <div class="featured-track scroll-reveal delay-1">
        <h3>"Me & My Baby"</h3>
        <p class="track-description">A R&B Rendition of the Timeless Hit</p>

        <div style="border-radius: 12px; box-shadow: inset 0 4px 12px rgba(0,0,0,0.7), inset 0 1px 3px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.4); padding: 4px; background: linear-gradient(145deg, #0d0d0d, #1a1a1a); overflow: hidden;">
          <video preload="metadata" playsinline controls
                 src="Video/InStudio.mp4"
                 style="width: 100%; display: block; border-radius: 8px;">
          </video>
        </div>
      </div>

    </div>

    <div class="divider"></div>

    <!-- PAGE FOOTER (shows on mobile only) -->
    <footer class="page-footer">
      <div class="footer-content">
        <p class="footer-text">
          &copy; 2026 <strong>Gold Bottom Entertainment LLC</strong> | All rights
          reserved.
        </p>
      </div>
    </footer>
  </div>
</section>
