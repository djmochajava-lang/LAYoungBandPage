    <!-- Video Control System: auto-play on scroll, mutual exclusion, no background music -->
    <script>
    (function() {
      'use strict';

      // ── References (supports any number of project videos) ──
      var video1 = document.getElementById('project-video-1');
      var video2 = document.getElementById('project-video-2');
      var video3 = document.getElementById('project-video-3');
      var videos = [video1, video2, video3].filter(Boolean);
      if (videos.length === 0) return;

      var observer = null;

      // ── State ──
      var activeVideo = null;
      var fullyVisible = new Map();
      videos.forEach(function(v) { fullyVisible.set(v, false); });

      // ── Mutual Exclusion ──
      function pauseOthers(playing) {
        videos.forEach(function(v) {
          if (v !== playing && !v.paused) {
            v.pause();
          }
        });
      }

      // ── Any other video currently playing? ──
      function anyOtherPlaying(video) {
        for (var i = 0; i < videos.length; i++) {
          if (videos[i] !== video && !videos[i].paused) return true;
        }
        return false;
      }

      // ── Any other video fully visible AND playing? ──
      function anyOtherVisibleAndPlaying(video) {
        for (var i = 0; i < videos.length; i++) {
          if (videos[i] !== video && !videos[i].paused && fullyVisible.get(videos[i])) return true;
        }
        return false;
      }

      // ── Manual Play Handling ──
      videos.forEach(function(v) {
        v.addEventListener('play', function() {
          activeVideo = v;
          pauseOthers(v);
        });
      });

      // When a video ends, clear active status
      videos.forEach(function(v) {
        v.addEventListener('ended', function() {
          if (activeVideo === v) {
            activeVideo = null;
          }
        });
      });

      // ── IntersectionObserver: Auto-Play / Auto-Stop ──
      if ('IntersectionObserver' in window) {
        observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            var video = entry.target;
            var ratio = entry.intersectionRatio;

            var isFullyVisible = (ratio >= 0.99);
            var isFullyOffScreen = (ratio === 0);

            fullyVisible.set(video, isFullyVisible);

            // AUTO-STOP: Video goes fully off-screen
            if (isFullyOffScreen && !video.paused) {
              video.pause();
              if (activeVideo === video) {
                activeVideo = null;
              }
            }

            // AUTO-PLAY: Video becomes fully visible
            if (isFullyVisible && video.paused) {
              if (!anyOtherPlaying(video)) {
                // Nothing else playing — auto-play this video
                video.play().catch(function() {});
                activeVideo = video;
              } else if (!anyOtherVisibleAndPlaying(video)) {
                // Others playing but not fully visible — stop them, play this
                pauseOthers(video);
                video.play().catch(function() {});
                activeVideo = video;
              }
              // If another is playing AND fully visible — do nothing
            }

            // EDGE: This video is playing but no longer fully visible
            if (!isFullyVisible && !video.paused) {
              // Find a fully-visible video that's paused and auto-play it
              for (var i = 0; i < videos.length; i++) {
                if (videos[i] !== video && fullyVisible.get(videos[i])) {
                  video.pause();
                  if (activeVideo === video) activeVideo = null;
                  if (videos[i].paused) {
                    videos[i].play().catch(function() {});
                    activeVideo = videos[i];
                  }
                  break;
                }
              }
            }
          });
        }, {
          threshold: [0, 1.0]
        });

        videos.forEach(function(v) { observer.observe(v); });
      }

      // ── Page Leave Cleanup ──
      function cleanup() {
        videos.forEach(function(v) {
          if (!v.paused) {
            v.pause();
          }
        });
        if (observer) {
          observer.disconnect();
        }
        window.removeEventListener('hashchange', onHashChange);
        window.removeEventListener('beforeunload', cleanup);
      }

      function onHashChange() {
        var hash = window.location.hash.substring(1) || 'home';
        if (hash !== 'projects') {
          cleanup();
        }
      }

      window.addEventListener('hashchange', onHashChange);
      window.addEventListener('beforeunload', cleanup);
    })();
    </script>
