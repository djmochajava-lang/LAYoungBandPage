<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Outfit 0: Funky Fresh - Red/Bold streetwear -->
  <defs>
    <linearGradient id="card0bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="jacket0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#a93226"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect x="2" y="2" width="116" height="156" rx="10" fill="url(#card0bg)"/>
  <rect x="6" y="6" width="108" height="148" rx="8" fill="#1a1a2e" opacity="0.85"/>

  <!-- Mannequin/outfit display -->
  <g transform="translate(60, 20)">
    <!-- Hanger -->
    <path d="M-20 5 Q0 -8 20 5" stroke="#C0C0C0" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="-8" r="3" fill="#C0C0C0"/>

    <!-- Jacket -->
    <path d="M-30 15 L-35 70 L-15 70 L-15 25 L15 25 L15 70 L35 70 L30 15 Z" fill="url(#jacket0)"/>
    <!-- Jacket lapels -->
    <path d="M-15 15 L-5 35 L0 15" fill="#c0392b"/>
    <path d="M15 15 L5 35 L0 15" fill="#c0392b"/>
    <!-- Jacket zipper -->
    <line x1="0" y1="35" x2="0" y2="70" stroke="#ffd700" stroke-width="1.5"/>

    <!-- Pants -->
    <path d="M-25 72 L-28 115 L-8 115 L-2 80 L2 80 L8 115 L28 115 L25 72 Z" fill="#1a1a1a"/>
    <!-- Belt -->
    <rect x="-26" y="70" width="52" height="5" rx="2" fill="#ffd700"/>

    <!-- Shoes -->
    <path d="M-28 113 L-6 113 L-4 118 L-30 118 Z" fill="#e63946"/>
    <path d="M8 113 L30 113 L32 118 L6 118 Z" fill="#e63946"/>

    <!-- Star emblem on jacket -->
    <polygon points="0,30 3,38 11,38 5,43 7,51 0,47 -7,51 -5,43 -11,38 -3,38" fill="#ffd700" opacity="0.9"/>
  </g>
</svg>