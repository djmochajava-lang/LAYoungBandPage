<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Outfit 2-2: Island Vibes - Yellow tropical shirt, red florals, white linen pants -->
  <defs>
    <linearGradient id="kr2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#f0c000"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="116" height="156" rx="10" fill="url(#kr2bg)"/>
  <rect x="6" y="6" width="108" height="148" rx="8" fill="#1a1a2e" opacity="0.85"/>
  <g transform="translate(60, 20)">
    <!-- Hanger -->
    <path d="M-20 5 Q0 -8 20 5" stroke="#C0C0C0" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="-8" r="3" fill="#C0C0C0"/>
    <!-- Yellow Hawaiian shirt -->
    <path d="M-32 10 L-35 70 L35 70 L32 10 Z" fill="#f4d03f"/>
    <!-- Collar -->
    <path d="M-14 8 L-6 20 L0 10" fill="#d4ac0a"/>
    <path d="M14 8 L6 20 L0 10" fill="#d4ac0a"/>
    <!-- Red sunglasses on collar -->
    <ellipse cx="-5" cy="14" rx="4" ry="2.5" fill="#e74c3c" opacity="0.8"/>
    <ellipse cx="5" cy="14" rx="4" ry="2.5" fill="#e74c3c" opacity="0.8"/>
    <line x1="-1" y1="14" x2="1" y2="14" stroke="#e74c3c" stroke-width="1"/>
    <!-- Red hibiscus flowers scattered -->
    <circle cx="-20" cy="30" r="4" fill="#e74c3c" opacity="0.8"/>
    <circle cx="-22" cy="28" r="2" fill="#c0392b"/>
    <circle cx="-18" cy="28" r="2" fill="#c0392b"/>
    <circle cx="18" cy="45" r="4" fill="#e74c3c" opacity="0.8"/>
    <circle cx="16" cy="43" r="2" fill="#c0392b"/>
    <circle cx="20" cy="43" r="2" fill="#c0392b"/>
    <circle cx="-12" cy="58" r="3" fill="#e74c3c" opacity="0.7"/>
    <circle cx="25" cy="25" r="3" fill="#e74c3c" opacity="0.7"/>
    <!-- Green leaf shapes -->
    <path d="M-16 34 Q-12 30 -10 34" stroke="#27ae60" stroke-width="1.5" fill="none"/>
    <path d="M22 48 Q26 44 28 48" stroke="#27ae60" stroke-width="1.5" fill="none"/>
    <path d="M-8 60 Q-4 56 -2 60" stroke="#27ae60" stroke-width="1" fill="none"/>
    <path d="M28 28 Q32 24 34 28" stroke="#27ae60" stroke-width="1" fill="none"/>
    <!-- Shirt buttons -->
    <circle cx="0" cy="26" r="1.5" fill="#daa520"/>
    <circle cx="0" cy="36" r="1.5" fill="#daa520"/>
    <circle cx="0" cy="46" r="1.5" fill="#daa520"/>
    <circle cx="0" cy="56" r="1.5" fill="#daa520"/>
    <!-- White linen pants -->
    <path d="M-26 72 L-28 115 L-6 115 L-2 80 L2 80 L6 115 L28 115 L26 72 Z" fill="#f0ead6"/>
    <!-- Slight crease/wrinkle details -->
    <line x1="-18" y1="78" x2="-17" y2="110" stroke="#ddd5c0" stroke-width="0.5"/>
    <line x1="18" y1="78" x2="17" y2="110" stroke="#ddd5c0" stroke-width="0.5"/>
    <!-- Cloth belt -->
    <rect x="-27" y="70" width="54" height="4" rx="2" fill="#d4ac0a"/>
    <!-- Brown flip-flops -->
    <path d="M-28 113 L-4 113 L-4 118 L-28 118 Z" fill="#8B4513"/>
    <path d="M6 113 L28 113 L28 118 L6 118 Z" fill="#8B4513"/>
    <line x1="-16" y1="113" x2="-14" y2="117" stroke="#6d3811" stroke-width="1"/>
    <line x1="16" y1="113" x2="14" y2="117" stroke="#6d3811" stroke-width="1"/>
  </g>
</svg>