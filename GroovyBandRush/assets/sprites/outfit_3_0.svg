<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <linearGradient id="jc0bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="jc0jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>
  </defs>
  <!-- Card background -->
  <rect x="2" y="2" width="116" height="156" rx="10" fill="url(#jc0bg)"/>
  <rect x="6" y="6" width="108" height="148" rx="8" fill="#1a1a2e" opacity="0.85"/>
  <!-- Outfit on hanger -->
  <g transform="translate(60, 20)">
    <!-- Hanger -->
    <path d="M-20 5 Q0 -8 20 5" stroke="#C0C0C0" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="-8" r="3" fill="#C0C0C0"/>
    <!-- Bomber jacket body -->
    <path d="M-26 8 L-28 62 L-8 64 L-5 30 L0 26 L5 30 L8 64 L28 62 L26 8 L16 5 L5 10 L0 8 L-5 10 L-16 5 Z" fill="url(#jc0jacket)" stroke="#176437" stroke-width="0.5"/>
    <!-- Bomber jacket sleeves -->
    <path d="M-26 8 L-33 50 L-23 52 L-16 10" fill="url(#jc0jacket)" stroke="#176437" stroke-width="0.5"/>
    <path d="M26 8 L33 50 L23 52 L16 10" fill="url(#jc0jacket)" stroke="#176437" stroke-width="0.5"/>
    <!-- Ribbed collar (bomber style) -->
    <path d="M-16 5 L-5 10 L0 8 L5 10 L16 5" stroke="#145a2c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Gold zipper down center -->
    <line x1="0" y1="10" x2="0" y2="62" stroke="#d4a843" stroke-width="1.2"/>
    <line x1="-0.8" y1="10" x2="-0.8" y2="62" stroke="#b8922e" stroke-width="0.3" opacity="0.5"/>
    <!-- Zipper teeth -->
    <line x1="-1.5" y1="14" x2="1.5" y2="14" stroke="#d4a843" stroke-width="0.5"/>
    <line x1="-1.5" y1="18" x2="1.5" y2="18" stroke="#d4a843" stroke-width="0.5"/>
    <line x1="-1.5" y1="22" x2="1.5" y2="22" stroke="#d4a843" stroke-width="0.5"/>
    <line x1="-1.5" y1="26" x2="1.5" y2="26" stroke="#d4a843" stroke-width="0.5"/>
    <line x1="-1.5" y1="30" x2="1.5" y2="30" stroke="#d4a843" stroke-width="0.5"/>
    <line x1="-1.5" y1="34" x2="1.5" y2="34" stroke="#d4a843" stroke-width="0.5"/>
    <line x1="-1.5" y1="38" x2="1.5" y2="38" stroke="#d4a843" stroke-width="0.5"/>
    <line x1="-1.5" y1="42" x2="1.5" y2="42" stroke="#d4a843" stroke-width="0.5"/>
    <line x1="-1.5" y1="46" x2="1.5" y2="46" stroke="#d4a843" stroke-width="0.5"/>
    <line x1="-1.5" y1="50" x2="1.5" y2="50" stroke="#d4a843" stroke-width="0.5"/>
    <line x1="-1.5" y1="54" x2="1.5" y2="54" stroke="#d4a843" stroke-width="0.5"/>
    <line x1="-1.5" y1="58" x2="1.5" y2="58" stroke="#d4a843" stroke-width="0.5"/>
    <!-- White tank top visible at neckline -->
    <path d="M-5 10 L0 8 L5 10 L3 22 L0 18 L-3 22 Z" fill="#f0f0f0" stroke="#ddd" stroke-width="0.3"/>
    <!-- Ribbed hem at bottom of jacket (zigzag) -->
    <polyline points="-28,60 -25,62 -22,60 -19,62 -16,60 -13,62 -10,60 -7,62 -4,60 -1,62 2,60 5,62 8,60 11,62 14,60 17,62 20,60 23,62 26,60 28,62" stroke="#145a2c" stroke-width="1.2" fill="none"/>
    <!-- Ribbed cuffs on sleeves -->
    <polyline points="-33,49 -31,51 -29,49 -27,51 -25,49 -23,51" stroke="#145a2c" stroke-width="1" fill="none"/>
    <polyline points="33,49 31,51 29,49 27,51 25,49 23,51" stroke="#145a2c" stroke-width="1" fill="none"/>
    <!-- Camo cargo pants -->
    <path d="M-18 64 L-20 108 L-8 108 L-2 75 L2 75 L8 108 L20 108 L18 64 Z" fill="#556B2F" stroke="#3d4f22" stroke-width="0.5"/>
    <!-- Camo darker patches -->
    <ellipse cx="-14" cy="74" rx="4" ry="3" fill="#3d4f22" opacity="0.7"/>
    <ellipse cx="10" cy="80" rx="5" ry="2.5" fill="#2e3d1a" opacity="0.6"/>
    <ellipse cx="-10" cy="90" rx="3" ry="4" fill="#2e3d1a" opacity="0.7"/>
    <ellipse cx="14" cy="95" rx="4" ry="3" fill="#3d4f22" opacity="0.6"/>
    <ellipse cx="-16" cy="100" rx="3" ry="2" fill="#4a6b2a" opacity="0.5"/>
    <ellipse cx="6" cy="70" rx="3" ry="2" fill="#3d4f22" opacity="0.5"/>
    <ellipse cx="-6" cy="82" rx="2.5" ry="3" fill="#4a6b2a" opacity="0.5"/>
    <ellipse cx="12" cy="102" rx="3" ry="2.5" fill="#2e3d1a" opacity="0.6"/>
    <!-- Cargo pockets on thighs -->
    <rect x="-19" y="78" width="8" height="10" rx="1" fill="none" stroke="#3d4f22" stroke-width="0.8"/>
    <line x1="-15" y1="80" x2="-15" y2="82" stroke="#3d4f22" stroke-width="0.5"/>
    <rect x="11" y="78" width="8" height="10" rx="1" fill="none" stroke="#3d4f22" stroke-width="0.8"/>
    <line x1="15" y1="80" x2="15" y2="82" stroke="#3d4f22" stroke-width="0.5"/>
    <!-- Pocket flaps -->
    <line x1="-19" y1="80" x2="-11" y2="80" stroke="#3d4f22" stroke-width="0.8"/>
    <line x1="11" y1="80" x2="19" y2="80" stroke="#3d4f22" stroke-width="0.8"/>
    <!-- Black sneakers -->
    <path d="M-20 108 L-22 114 L-6 114 L-8 108 Z" fill="#1a1a1a" stroke="#111" stroke-width="0.5"/>
    <path d="M8 108 L6 114 L22 114 L20 108 Z" fill="#1a1a1a" stroke="#111" stroke-width="0.5"/>
    <!-- White soles -->
    <rect x="-23" y="113" width="18" height="3" rx="1.5" fill="#f0f0f0" stroke="#ddd" stroke-width="0.3"/>
    <rect x="5" y="113" width="18" height="3" rx="1.5" fill="#f0f0f0" stroke="#ddd" stroke-width="0.3"/>
  </g>
</svg>