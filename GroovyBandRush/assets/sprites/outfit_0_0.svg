<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <linearGradient id="e0bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    <linearGradient id="e0jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e5a8a"/>
      <stop offset="100%" stop-color="#153d5e"/>
    </linearGradient>
    <linearGradient id="e0tie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2980b9"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
    <linearGradient id="e0shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
  </defs>
  <!-- Card background -->
  <rect x="2" y="2" width="116" height="156" rx="10" fill="url(#e0bg)"/>
  <rect x="6" y="6" width="108" height="148" rx="8" fill="#1a1a2e" opacity="0.85"/>
  <!-- Outfit on hanger -->
  <g transform="translate(60, 20)">
    <!-- Hanger -->
    <path d="M-20 5 Q0 -8 20 5" stroke="#C0C0C0" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="-8" r="3" fill="#C0C0C0"/>
    <!-- Suit jacket -->
    <path d="M-28 10 L-30 70 L-8 72 L-5 35 L0 30 L5 35 L8 72 L30 70 L28 10 L18 5 L5 12 L0 10 L-5 12 L-18 5 Z" fill="url(#e0jacket)" stroke="#12334a" stroke-width="0.5"/>
    <!-- Pinstripes on jacket -->
    <line x1="-22" y1="12" x2="-24" y2="68" stroke="#2a6e9e" stroke-width="0.4" opacity="0.5"/>
    <line x1="-16" y1="8" x2="-18" y2="70" stroke="#2a6e9e" stroke-width="0.4" opacity="0.5"/>
    <line x1="-10" y1="7" x2="-10" y2="71" stroke="#2a6e9e" stroke-width="0.4" opacity="0.5"/>
    <line x1="10" y1="7" x2="10" y2="71" stroke="#2a6e9e" stroke-width="0.4" opacity="0.5"/>
    <line x1="16" y1="8" x2="18" y2="70" stroke="#2a6e9e" stroke-width="0.4" opacity="0.5"/>
    <line x1="22" y1="12" x2="24" y2="68" stroke="#2a6e9e" stroke-width="0.4" opacity="0.5"/>
    <!-- Lapels -->
    <path d="M-5 12 L-12 28 L-5 35" fill="#163d5c" stroke="#12334a" stroke-width="0.5"/>
    <path d="M5 12 L12 28 L5 35" fill="#163d5c" stroke="#12334a" stroke-width="0.5"/>
    <!-- White dress shirt (V opening) -->
    <path d="M-5 12 L0 10 L5 12 L3 35 L0 30 L-3 35 Z" fill="#f0f0f0" stroke="#ddd" stroke-width="0.3"/>
    <!-- Blue tie -->
    <path d="M-1.5 14 L0 12 L1.5 14 L2 28 L0 32 L-2 28 Z" fill="url(#e0tie)"/>
    <!-- Diagonal stripes on tie -->
    <line x1="-1" y1="18" x2="1.5" y2="16" stroke="#1a4a6e" stroke-width="0.5" opacity="0.6"/>
    <line x1="-1.2" y1="22" x2="1.8" y2="20" stroke="#1a4a6e" stroke-width="0.5" opacity="0.6"/>
    <line x1="-1.5" y1="26" x2="2" y2="24" stroke="#1a4a6e" stroke-width="0.5" opacity="0.6"/>
    <!-- Gold cufflinks -->
    <circle cx="-28" cy="55" r="1.5" fill="#d4a843" stroke="#b8922e" stroke-width="0.3"/>
    <circle cx="28" cy="55" r="1.5" fill="#d4a843" stroke="#b8922e" stroke-width="0.3"/>
    <!-- Sleeves -->
    <path d="M-28 10 L-35 55 L-25 57 L-18 14" fill="url(#e0jacket)" stroke="#12334a" stroke-width="0.5"/>
    <path d="M28 10 L35 55 L25 57 L18 14" fill="url(#e0jacket)" stroke="#12334a" stroke-width="0.5"/>
    <!-- Sleeve pinstripes -->
    <line x1="-30" y1="20" x2="-33" y2="54" stroke="#2a6e9e" stroke-width="0.4" opacity="0.4"/>
    <line x1="-25" y1="14" x2="-28" y2="56" stroke="#2a6e9e" stroke-width="0.4" opacity="0.4"/>
    <line x1="30" y1="20" x2="33" y2="54" stroke="#2a6e9e" stroke-width="0.4" opacity="0.4"/>
    <line x1="25" y1="14" x2="28" y2="56" stroke="#2a6e9e" stroke-width="0.4" opacity="0.4"/>
    <!-- Dark navy pants -->
    <path d="M-20 72 L-22 110 L-10 110 L-2 80 L2 80 L10 110 L22 110 L20 72 Z" fill="#0f1a2e" stroke="#0a1220" stroke-width="0.5"/>
    <!-- Pant creases -->
    <line x1="-16" y1="74" x2="-16" y2="108" stroke="#182840" stroke-width="0.6" opacity="0.5"/>
    <line x1="16" y1="74" x2="16" y2="108" stroke="#182840" stroke-width="0.6" opacity="0.5"/>
    <!-- Black dress shoes -->
    <ellipse cx="-16" cy="112" rx="8" ry="4" fill="url(#e0shoe)"/>
    <ellipse cx="16" cy="112" rx="8" ry="4" fill="url(#e0shoe)"/>
    <!-- Shoe shine -->
    <ellipse cx="-14" cy="111" rx="3" ry="1.5" fill="#333" opacity="0.5"/>
    <ellipse cx="14" cy="111" rx="3" ry="1.5" fill="#333" opacity="0.5"/>
  </g>
</svg>
