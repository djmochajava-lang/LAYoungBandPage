<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <linearGradient id="la1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="la1body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="la1belt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#daa520"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#daa520"/>
    </linearGradient>
  </defs>
  <!-- Card background -->
  <rect x="2" y="2" width="116" height="156" rx="10" fill="url(#la1bg)"/>
  <rect x="6" y="6" width="108" height="148" rx="8" fill="#1a1a2e" opacity="0.85"/>
  <!-- Outfit on hanger -->
  <g transform="translate(60, 20)">
    <!-- Hanger -->
    <path d="M-20 5 Q0 -8 20 5" stroke="#C0C0C0" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="-8" r="3" fill="#C0C0C0"/>
    <!-- Off-shoulder neckline - wide horizontal bar showing shoulders -->
    <path d="M-28 10 Q-20 7 -14 10 Q0 14 14 10 Q20 7 28 10" stroke="#b02e38" stroke-width="0.5" fill="url(#la1body)"/>
    <!-- Fitted bodice -->
    <path d="M-28 10 L-24 20 L-20 35 L-16 42 L16 42 L20 35 L24 20 L28 10 Q20 7 14 10 Q0 14 -14 10 Q-20 7 -28 10 Z" fill="url(#la1body)" stroke="#a02838" stroke-width="0.5"/>
    <!-- Neckline drape detail -->
    <path d="M-20 10 Q0 16 20 10" stroke="#a02838" stroke-width="0.5" fill="none" opacity="0.5"/>
    <path d="M-16 12 Q0 17 16 12" stroke="#a02838" stroke-width="0.4" fill="none" opacity="0.3"/>
    <!-- Bodice drape/fold lines -->
    <path d="M-10 15 Q-8 28 -10 40" stroke="#a02838" stroke-width="0.4" fill="none" opacity="0.4"/>
    <path d="M10 15 Q8 28 10 40" stroke="#a02838" stroke-width="0.4" fill="none" opacity="0.4"/>
    <path d="M0 14 L0 40" stroke="#a02838" stroke-width="0.3" fill="none" opacity="0.3"/>
    <!-- Gold belt at waist -->
    <rect x="-18" y="42" width="36" height="5" rx="1" fill="url(#la1belt)" stroke="#b8941a" stroke-width="0.3"/>
    <!-- Oval belt buckle -->
    <ellipse cx="0" cy="44.5" rx="5" ry="3" fill="#ffd700" stroke="#b8941a" stroke-width="0.5"/>
    <ellipse cx="0" cy="44.5" rx="3.5" ry="2" fill="none" stroke="#b8941a" stroke-width="0.4"/>
    <!-- Wide-leg/bell-bottom pants -->
    <path d="M-18 47 L-16 65 L-18 80 L-24 100 L-32 118 L-2 118 L-2 80 L0 65 L2 80 L2 118 L32 118 L24 100 L18 80 L16 65 L18 47 Z" fill="url(#la1body)" stroke="#a02838" stroke-width="0.5"/>
    <!-- Pant center crease lines -->
    <line x1="-16" y1="50" x2="-18" y2="116" stroke="#a02838" stroke-width="0.5" opacity="0.4"/>
    <line x1="16" y1="50" x2="18" y2="116" stroke="#a02838" stroke-width="0.5" opacity="0.4"/>
    <!-- Fabric fold lines on pants -->
    <path d="M-10 55 Q-12 70 -14 85" stroke="#a02838" stroke-width="0.3" fill="none" opacity="0.3"/>
    <path d="M10 55 Q12 70 14 85" stroke="#a02838" stroke-width="0.3" fill="none" opacity="0.3"/>
    <path d="M-20 90 Q-24 100 -28 112" stroke="#a02838" stroke-width="0.3" fill="none" opacity="0.25"/>
    <path d="M20 90 Q24 100 28 112" stroke="#a02838" stroke-width="0.3" fill="none" opacity="0.25"/>
    <!-- Gold bracelet on left wrist -->
    <ellipse cx="-26" cy="15" rx="3" ry="1.5" fill="none" stroke="#ffd700" stroke-width="1.2"/>
    <ellipse cx="-26" cy="15" rx="3" ry="1.5" fill="none" stroke="#daa520" stroke-width="0.4"/>
    <!-- Red high-heeled boots peeking at bottom -->
    <path d="M-28 116 L-32 118 L-32 124 L-22 124 L-22 120 L-6 120 L-6 118 Z" fill="#c0392b" stroke="#8b1a1a" stroke-width="0.4"/>
    <path d="M28 116 L32 118 L32 124 L22 124 L22 120 L6 120 L6 118 Z" fill="#c0392b" stroke="#8b1a1a" stroke-width="0.4"/>
    <!-- Boot heels -->
    <rect x="-31" y="124" width="3" height="4" rx="0.5" fill="#8b1a1a"/>
    <rect x="28" y="124" width="3" height="4" rx="0.5" fill="#8b1a1a"/>
  </g>
</svg>
