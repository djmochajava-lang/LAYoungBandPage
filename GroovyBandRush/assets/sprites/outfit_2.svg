<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Outfit 2: Wild Style - Green/Funky stage outfit -->
  <defs>
    <linearGradient id="card2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="wild2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect x="2" y="2" width="116" height="156" rx="10" fill="url(#card2bg)"/>
  <rect x="6" y="6" width="108" height="148" rx="8" fill="#1a1a2e" opacity="0.85"/>

  <!-- Mannequin/outfit display -->
  <g transform="translate(60, 20)">
    <!-- Hanger -->
    <path d="M-20 5 Q0 -8 20 5" stroke="#C0C0C0" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="-8" r="3" fill="#C0C0C0"/>

    <!-- Funky jumpsuit top -->
    <path d="M-28 15 L-32 72 L32 72 L28 15 Z" fill="url(#wild2)"/>
    <!-- Deep V-neck -->
    <path d="M-12 15 L0 45 L12 15" fill="#1a1a2e"/>
    <!-- Collar points -->
    <path d="M-20 15 L-25 28 L-12 20" fill="#1e8449"/>
    <path d="M20 15 L25 28 L12 20" fill="#1e8449"/>
    <!-- Chest chain -->
    <path d="M-8 30 Q0 35 8 30" stroke="#ffd700" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="35" r="3" fill="#ffd700"/>
    <!-- Zigzag pattern -->
    <path d="M-28 50 L-22 44 L-16 50 L-10 44 L-4 50 L2 44 L8 50 L14 44 L20 50 L26 44 L32 50" stroke="#ffd700" stroke-width="1.5" fill="none"/>
    <!-- Star sequins -->
    <circle cx="-15" cy="35" r="2" fill="#ffd700" opacity="0.8"/>
    <circle cx="15" cy="38" r="2" fill="#ffd700" opacity="0.8"/>
    <circle cx="-20" cy="58" r="1.5" fill="#ffd700" opacity="0.6"/>
    <circle cx="20" cy="55" r="1.5" fill="#ffd700" opacity="0.6"/>
    <circle cx="0" cy="60" r="2" fill="#ffd700" opacity="0.7"/>

    <!-- Belt with big buckle -->
    <rect x="-30" y="70" width="60" height="6" rx="2" fill="#ffd700"/>
    <rect x="-6" y="68" width="12" height="10" rx="2" fill="#ffd700"/>
    <rect x="-4" y="70" width="8" height="6" rx="1" fill="#2ecc71"/>

    <!-- Bell-bottom pants -->
    <path d="M-25 77 L-35 115 L-5 115 L-2 82 L2 82 L5 115 L35 115 L25 77 Z" fill="url(#wild2)"/>
    <!-- Pants stripe -->
    <line x1="-16" y1="80" x2="-22" y2="115" stroke="#ffd700" stroke-width="2"/>
    <line x1="16" y1="80" x2="22" y2="115" stroke="#ffd700" stroke-width="2"/>

    <!-- Platform shoes -->
    <rect x="-36" y="113" width="32" height="4" rx="2" fill="#ffd700"/>
    <rect x="-36" y="117" width="32" height="5" rx="1" fill="#1e8449"/>
    <rect x="4" y="113" width="32" height="4" rx="2" fill="#ffd700"/>
    <rect x="4" y="117" width="32" height="5" rx="1" fill="#1e8449"/>
  </g>
</svg>