<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Outfit 1: Classic Soul - Blue/Elegant suit -->
  <defs>
    <linearGradient id="card1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2471a3"/>
    </linearGradient>
    <linearGradient id="suit1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect x="2" y="2" width="116" height="156" rx="10" fill="url(#card1bg)"/>
  <rect x="6" y="6" width="108" height="148" rx="8" fill="#1a1a2e" opacity="0.85"/>

  <!-- Mannequin/outfit display -->
  <g transform="translate(60, 20)">
    <!-- Hanger -->
    <path d="M-20 5 Q0 -8 20 5" stroke="#C0C0C0" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="-8" r="3" fill="#C0C0C0"/>

    <!-- Suit jacket -->
    <path d="M-30 15 L-35 75 L-5 75 L-5 30 L5 30 L5 75 L35 75 L30 15 Z" fill="url(#suit1)"/>
    <!-- Lapels -->
    <path d="M-18 15 L-8 38 L0 20" fill="#1a5276"/>
    <path d="M18 15 L8 38 L0 20" fill="#1a5276"/>
    <!-- Shirt underneath -->
    <rect x="-5" y="20" width="10" height="55" fill="white"/>
    <!-- Tie -->
    <polygon points="0,22 -4,28 0,65 4,28" fill="#ffd700"/>
    <!-- Pocket square -->
    <path d="M15 32 L22 32 L22 40 L18 36 L15 40 Z" fill="#ffd700"/>
    <!-- Buttons -->
    <circle cx="-7" cy="45" r="2" fill="#C0C0C0"/>
    <circle cx="-7" cy="58" r="2" fill="#C0C0C0"/>

    <!-- Pants -->
    <path d="M-25 77 L-26 115 L-6 115 L-2 82 L2 82 L6 115 L26 115 L25 77 Z" fill="#1a5276"/>
    <!-- Pants crease -->
    <line x1="-16" y1="80" x2="-16" y2="113" stroke="#154360" stroke-width="1" opacity="0.5"/>
    <line x1="16" y1="80" x2="16" y2="113" stroke="#154360" stroke-width="1" opacity="0.5"/>

    <!-- Dress shoes -->
    <path d="M-28 113 L-4 113 Q-2 118 -30 118 Z" fill="#2c3e50"/>
    <path d="M4 113 L28 113 Q30 118 2 118 Z" fill="#2c3e50"/>
    <!-- Shoe shine -->
    <ellipse cx="-16" cy="115" rx="6" ry="2" fill="#34495e"/>
    <ellipse cx="16" cy="115" rx="6" ry="2" fill="#34495e"/>
  </g>
</svg>