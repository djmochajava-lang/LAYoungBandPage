<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Outfit 1-1: Bass Boss - Black vest over purple silk shirt, gold chain belt -->
  <defs>
    <linearGradient id="kw1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c003e"/>
      <stop offset="100%" stop-color="#1a0025"/>
    </linearGradient>
    <linearGradient id="kw1shirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d3c98"/>
      <stop offset="30%" stop-color="#9b59b6"/>
      <stop offset="60%" stop-color="#8e44ad"/>
      <stop offset="100%" stop-color="#7d3c98"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="116" height="156" rx="10" fill="url(#kw1bg)"/>
  <rect x="6" y="6" width="108" height="148" rx="8" fill="#1a1a2e" opacity="0.85"/>
  <g transform="translate(60, 20)">
    <!-- Hanger -->
    <path d="M-20 5 Q0 -8 20 5" stroke="#C0C0C0" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="-8" r="3" fill="#C0C0C0"/>
    <!-- Purple silk shirt -->
    <path d="M-30 12 L-34 72 L34 72 L30 12 Z" fill="url(#kw1shirt)"/>
    <!-- Shirt collar -->
    <path d="M-12 10 L-6 20 L0 12" fill="#8e44ad"/>
    <path d="M12 10 L6 20 L0 12" fill="#8e44ad"/>
    <!-- Shirt buttons -->
    <circle cx="0" cy="28" r="1.5" fill="#ddd" opacity="0.6"/>
    <circle cx="0" cy="38" r="1.5" fill="#ddd" opacity="0.6"/>
    <circle cx="0" cy="48" r="1.5" fill="#ddd" opacity="0.6"/>
    <!-- Black vest (unbuttoned V-shape) -->
    <path d="M-28 14 L-32 72 L-10 72 L-4 35 Z" fill="#1a1a1a"/>
    <path d="M28 14 L32 72 L10 72 L4 35 Z" fill="#1a1a1a"/>
    <!-- Vest edge stitching -->
    <line x1="-10" y1="72" x2="-4" y2="35" stroke="#333" stroke-width="0.5"/>
    <line x1="10" y1="72" x2="4" y2="35" stroke="#333" stroke-width="0.5"/>
    <!-- Gold chain belt -->
    <circle cx="-20" cy="73" r="2" fill="none" stroke="#ffd700" stroke-width="1.5"/>
    <circle cx="-14" cy="73" r="2" fill="none" stroke="#ffd700" stroke-width="1.5"/>
    <circle cx="-8" cy="73" r="2" fill="none" stroke="#ffd700" stroke-width="1.5"/>
    <circle cx="-2" cy="73" r="2" fill="none" stroke="#ffd700" stroke-width="1.5"/>
    <circle cx="4" cy="73" r="2" fill="none" stroke="#ffd700" stroke-width="1.5"/>
    <circle cx="10" cy="73" r="2" fill="none" stroke="#ffd700" stroke-width="1.5"/>
    <circle cx="16" cy="73" r="2" fill="none" stroke="#ffd700" stroke-width="1.5"/>
    <!-- Black fitted pants -->
    <path d="M-25 76 L-27 115 L-8 115 L-2 84 L2 84 L8 115 L27 115 L25 76 Z" fill="#111"/>
    <!-- Crease lines -->
    <line x1="-18" y1="80" x2="-18" y2="112" stroke="#222" stroke-width="0.5"/>
    <line x1="18" y1="80" x2="18" y2="112" stroke="#222" stroke-width="0.5"/>
    <!-- Purple suede shoes -->
    <path d="M-27 113 L-6 113 L-4 119 L-29 119 Z" fill="#6c3483"/>
    <path d="M8 113 L27 113 L29 119 L6 119 Z" fill="#6c3483"/>
    <!-- Gold cuff rings -->
    <circle cx="-32" cy="68" r="1.5" fill="#ffd700"/>
    <circle cx="32" cy="68" r="1.5" fill="#ffd700"/>
  </g>
</svg>