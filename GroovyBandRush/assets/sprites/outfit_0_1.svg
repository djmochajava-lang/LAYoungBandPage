    <path d="M-26 30 L-22 26 L-18 30 Z" fill="#ffd700"/>
    <!-- Charcoal pants -->
    <path d="M-26 74 L-28 115 L-8 115 L-2 82 L2 82 L8 115 L28 115 L26 74 Z" fill="#333333"/>
    <!-- Belt -->
    <rect x="-27" y="72" width="54" height="4" rx="2" fill="#1a1a1a"/>
    <rect x="-3" y="71" width="6" height="6" rx="1" fill="#C0C0C0"/>
    <!-- Black shoes -->
    <path d="M-28 113 L-6 113 L-4 118 L-30 118 Z" fill="#1a1a1a"/>
    <path d="M8 113 L28 113 L30 118 L6 118 Z" fill="#1a1a1a"/>
    <ellipse cx="-18" cy="114" rx="4" ry="1" fill="#333" opacity="0.5"/>
    <ellipse cx="18" cy="114" rx="4" ry="1" fill="#333" opacity="0.5"/>
  </g>
