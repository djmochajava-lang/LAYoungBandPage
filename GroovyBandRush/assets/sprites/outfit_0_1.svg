<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Outfit 0-1: Smooth Operator - Burgundy velvet blazer, black turtleneck, gold chain -->
  <defs>
    <linearGradient id="e1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b0000"/>
      <stop offset="100%" stop-color="#5c0000"/>
    </linearGradient>
    <linearGradient id="e1blazer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b0000"/>
      <stop offset="40%" stop-color="#a01010"/>
      <stop offset="100%" stop-color="#6b0000"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="116" height="156" rx="10" fill="url(#e1bg)"/>
  <rect x="6" y="6" width="108" height="148" rx="8" fill="#1a1a2e" opacity="0.85"/>
  <g transform="translate(60, 20)">
    <!-- Hanger -->
    <path d="M-20 5 Q0 -8 20 5" stroke="#C0C0C0" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="-8" r="3" fill="#C0C0C0"/>
    <!-- Black turtleneck -->
    <path d="M-8 10 L-8 25 L8 25 L8 10 Q0 5 -8 10" fill="#1a1a1a"/>
    <path d="M-5 8 Q0 4 5 8" stroke="#333" stroke-width="1" fill="none"/>
    <!-- Burgundy blazer -->
    <path d="M-32 15 L-36 72 L-14 72 L-14 28 L14 28 L14 72 L36 72 L32 15 Z" fill="url(#e1blazer)"/>
    <!-- Blazer lapels -->
    <path d="M-14 15 L-4 38 L0 18" fill="#6b0000"/>
    <path d="M14 15 L4 38 L0 18" fill="#6b0000"/>
    <!-- Velvet sheen highlights -->
    <line x1="-22" y1="30" x2="-22" y2="60" stroke="#a01010" stroke-width="1" opacity="0.4"/>
    <line x1="22" y1="30" x2="22" y2="60" stroke="#a01010" stroke-width="1" opacity="0.4"/>
    <!-- Gold chain necklace -->
    <path d="M-10 18 Q-6 22 0 24 Q6 22 10 18" stroke="#ffd700" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="25" r="2" fill="#ffd700"/>
